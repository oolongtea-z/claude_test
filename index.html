<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>タイマー</h1>

    <div class="display" id="display">00:00:00</div>

    <div class="controls">
      <button id="startBtn" class="btn btn-start">スタート</button>
      <button id="pauseBtn" class="btn btn-pause" disabled>一時停止</button>
      <button id="resetBtn" class="btn btn-reset">リセット</button>
    </div>

    <div class="lap-section">
      <button id="lapBtn" class="btn btn-lap" disabled>ラップ</button>
      <ul id="lapList"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
