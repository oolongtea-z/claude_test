<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムポケモン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ランダムポケモン</h1>

    <div class="card" id="card">
      <div class="card-inner" id="cardInner">
        <div class="placeholder" id="placeholder">
          <span>クリックしてポケモンを表示</span>
        </div>

        <div class="pokemon-info hidden" id="pokemonInfo">
          <div class="pokemon-number" id="pokemonNumber">#000</div>
          <div class="sprite-wrapper">
            <img id="sprite" src="" alt="">
          </div>
          <div class="pokemon-name" id="pokemonName">???</div>
          <div class="type-badges" id="typeBadges"></div>
          <div class="stats" id="stats"></div>
        </div>

        <div class="loading hidden" id="loading">
          <div class="pokeball">
            <div class="pokeball-top"></div>
            <div class="pokeball-middle"></div>
            <div class="pokeball-bottom"></div>
          </div>
        </div>
      </div>
    </div>

    <button class="btn" id="btn">次のポケモン</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
